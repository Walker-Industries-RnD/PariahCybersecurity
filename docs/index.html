<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pariah Cybersecurity v2.0.0 – Local-first, post-quantum security suite" />
  <title>PARIAH CYBERSECURITY v2.0.0</title>
  <link rel="canonical" href="https://walker-industries-rnd.github.io/PariahCybersecurity/welcome-to-pariah-cybersecurity-v2.0.0.html" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: #000000;
      color: #00ff00;
      font-family: 'Orbitron', monospace;
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* CRT / Scanline overlay - darker for more black */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* Subtle green tint overlay for matrix feel */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, rgba(0,255,0,0.05), transparent 70%);
      pointer-events: none;
      z-index: 998;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: 8px;
      margin: 0;
      background: linear-gradient(90deg, #00ff00, #00cc00, #00ff00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px #00ff00, 0 0 40px #00cc00;
      animation: glitch 2.5s infinite;
    }

    .subtitle {
      font-size: 1.4rem;
      letter-spacing: 6px;
      margin: 1rem 0;
      color: #00cc00;
      text-shadow: 0 0 15px #00ff00;
    }

    .tagline {
      margin: 1.5rem 0;
      color: #008800;
      letter-spacing: 4px;
      font-size: 1rem;
      opacity: 0.8;
    }

    .countdown {
      font-size: 2.2rem;
      font-weight: 700;
      color: #00ff00;
      text-shadow: 0 0 20px #00ff00;
      margin: 2rem 0;
    }

    .manual {
      font-size: 1rem;
      opacity: 0.7;
      margin-top: 3rem;
    }

    a {
      color: #00ff00;
      text-decoration: none;
      border-bottom: 2px solid #00cc00;
      padding-bottom: 4px;
    }

    a:hover {
      color: #00cc00;
      border-color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    /* Glitch animation - green channel emphasis */
    @keyframes glitch {
      0%,100% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); text-shadow: 3px 0 #00ff00, -3px 0 #00cc00; }
      40% { transform: translate(-3px, -3px); text-shadow: -3px 0 #00ff00, 3px 0 #00cc00; }
      60% { transform: translate(3px, 0); }
      80% { transform: translate(3px, 3px); text-shadow: 3px 0 #00ff00; }
    }

    /* CRT flicker - subtler for black dominance */
    @keyframes flicker {
      0%,100% { opacity: 1; }
      50% { opacity: 0.95; }
    }
    body { animation: flicker 3s infinite; }

    /* Optional matrix rain background for extra green-on-black hacker vibe */
    #matrix-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.15;
    }
  </style>
</head>
<body>
  <canvas id="matrix-bg"></canvas>

  <div class="container" style="z-index: 2;">
    <h1>PARIAH</h1>
    <div class="subtitle">CYBERSECURITY v2.0.0</div>
    <p class="tagline">LOCAL-FIRST • POST-QUANTUM • .NET 8</p>
    
    <div class="countdown" id="countdown">1.5</div>
    
    <div class="manual">
      <p>If not redirected, <a href="https://walker-industries-rnd.github.io/PariahCybersecurity/welcome-to-pariah-cybersecurity-v2.0.0.html">FORCE ACCESS</a></p>
    </div>
  </div>

  <script>
    // Matrix rain effect for ultimate black/green hacker aesthetic
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const matrixChars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+-=[]{}|;:,.<>?';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff00';
      ctx.font = `${fontSize}px monospace`;

      drops.forEach((y, x) => {
        const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        const xPos = x * fontSize;
        const yPos = y * fontSize;
        ctx.fillText(char, xPos, yPos);

        if (yPos > canvas.height && Math.random() > 0.975) drops[x] = 0;
        drops[x]++;
      });
    }

    setInterval(drawMatrix, 50);

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Redirect logic
    const redirectUrl = "https://walker-industries-rnd.github.io/PariahCybersecurity/welcome-to-pariah-cybersecurity-v2.0.0.html";
    const countdownEl = document.getElementById("countdown");

    let timeLeft = 1.5;

    const timer = setInterval(() => {
      timeLeft -= 0.1;
      countdownEl.textContent = timeLeft.toFixed(1);
      countdownEl.style.textShadow = `0 0 ${20 + timeLeft*25}px #00ff00`;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.replace(redirectUrl);
      }
    }, 100);

    // Hard fallback
    setTimeout(() => window.location.replace(redirectUrl), 1800);
  </script>
</body>
</html>
